[platformio]
default_envs = esp32dev-fast

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/generate_playlist.py

build_flags =
    -D USER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_user_setup.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

[env:esp32dev-fast]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D SPI_FREQUENCY=80000000

[env:esp32dev-ili9341]
extends = env:esp32dev-fast
build_flags =
    -D USER_SETUP_LOADED=1
    -D SPI_FREQUENCY=40000000
    -include $PROJECT_DIR/include/cyd_ili9341_setup.h

[env:esp32dev-ili9341-low-memory]
extends = env:esp32dev-ili9341
build_flags =
    ${env:esp32dev-ili9341.build_flags}
    -D CYD_LOW_MEMORY_DIRECT_RENDER=1

[env:esp32dev-fast-low-memory]
extends = env:esp32dev-fast
build_flags =
    ${env:esp32dev-fast.build_flags}
    -D CYD_LOW_MEMORY_DIRECT_RENDER=1

[env:fnk0114l]
extends = env:esp32dev
build_flags =
    -D USER_SETUP_LOADED=1
    -D BOARD_FREENOVE_FNK0114L=1
    -include $PROJECT_DIR/include/freenove_fnk0114l_setup.h

[env:fnk0114l-low-memory]
extends = env:fnk0114l
build_flags =
    ${env:fnk0114l.build_flags}
    -D CYD_LOW_MEMORY_DIRECT_RENDER=1

[env:jc3248w535]
extends = env:esp32dev
board = jc3248w535
board_build.partitions = partitions_jc3248w535.csv
build_flags =
    -D BOARD_JC3248W535=1
    -D CYD_LOW_MEMORY_DIRECT_RENDER=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
    moononournation/GFX Library for Arduino @ 1.6.0
