name: Build and deploy web flasher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32dev-fast-low-memory
          pio run -e esp32dev-ili9341-low-memory
          pio run -e fnk0114l-low-memory
          pio run -e jc3248w535

      - name: Assemble website and firmware
        env:
          VERSION: ${{ github.sha }}
        run: |
          mkdir -p site/firmware/cyd site/firmware/cyd-ili9341 site/firmware/freenove site/firmware/jc3248w535
          cp web-flasher/index.html site/index.html
          cp web-flasher/manifest.json site/manifest.json
          cp web-flasher/manifest-cyd-ili9341.json site/manifest-cyd-ili9341.json
          cp web-flasher/manifest-freenove.json site/manifest-freenove.json
          cp web-flasher/manifest-jc3248w535.json site/manifest-jc3248w535.json
          cp src/CYD-PET-Radio.png site/CYD-PET-Radio.png
          for target in cyd cyd-ili9341 freenove jc3248w535; do
            case "$target" in
              cyd) env_name=esp32dev-fast-low-memory ;;
              cyd-ili9341) env_name=esp32dev-ili9341-low-memory ;;
              freenove) env_name=fnk0114l-low-memory ;;
              jc3248w535) env_name=jc3248w535 ;;
            esac
            cp ".pio/build/$env_name/bootloader.bin" "site/firmware/$target/bootloader.bin"
            cp ".pio/build/$env_name/partitions.bin" "site/firmware/$target/partitions.bin"
            cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "site/firmware/$target/boot_app0.bin"
            cp ".pio/build/$env_name/firmware.bin" "site/firmware/$target/firmware.bin"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"][:7]
          for manifest in Path("site").glob("manifest*.json"):
              data = json.loads(manifest.read_text())
              data["version"] = version
              manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
